const CAT_COLORS = {};
let filter="all", query="";
const out=document.getElementById("out"), cnt=document.getElementById("cnt");
document.getElementById("tot").textContent = DATA.length;

function render(){
  const q = query.trim().toLowerCase();
  const rows = DATA.filter(r => (filter==="all"||r[0]===filter) &&
    (!q || (r[1]+r[2]+r[3]+r[4]).toLowerCase().includes(q)));
  cnt.textContent = rows.length + " / " + DATA.length;
  if(!rows.length){ out.innerHTML='<div class="empty">没找到。换个词试试，比如「视频」「硬件」「pdf」。</div>'; return; }
  // 按 技能/工具 → 分类 分组
  const groups = new Map();
  rows.forEach(r=>{
    const key = (r[0]==="skill"?"🛠 技能 · ":"⚙ 工具 · ") + r[1];
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(r);
  });
  let html="";
  groups.forEach((items,key)=>{
    html += '<section><h2>'+key+'</h2><div class="grid">';
    items.forEach(r=>{
      html += '<div class="item"><div class="n">'+r[3]+' <code>'+r[2]+'</code></div><div class="d">'+r[4]+'</div></div>';
    });
    html += '</div></section>';
  });
  out.innerHTML = html;
}

document.getElementById("q").addEventListener("input", e=>{ query=e.target.value; render(); });
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); filter=b.dataset.c; render();
}));
render();
</script>
